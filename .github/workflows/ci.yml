name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist актуален
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist не совпадает с исходниками: выполните npm run build и закоммитьте dist"
            git status --porcelain dist
            git diff --stat dist
            exit 1
          fi

  # Сам action на себе: без секретов он должен предупредить и не уронить задачу,
  # с секретами TELEGRAM_TOKEN/TELEGRAM_CHAT_ID — прислать сообщение.
  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Локальный action (uses: ./) требует checkout до вызова.
      - uses: actions/checkout@v7
      - id: tg
        uses: ./
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          topic_id: ${{ vars.TELEGRAM_TOPIC_ID || secrets.TELEGRAM_TOPIC_ID }}
      - name: Пауза, чтобы увидеть обновление
        run: sleep 8
      - run: echo "message_id=${{ steps.tg.outputs.message_id }}"
